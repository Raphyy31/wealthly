<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon.svg?v=4" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg?v=4" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F9F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10150F" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yotori" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Yotori Finance — Le patrimoine de votre famille, enfin clair</title>
    <meta name="description" content="Yotori Finance rassemble tous vos comptes, placements et biens dans un tableau de bord moderne. Pour particuliers et familles qui veulent piloter leur patrimoine sans complexité." />

    <!-- No-flash theme: applied before first paint so the first frame matches user preference. -->
    <script>
      (function() {
        try {
          // Rebranding Wealthly → Yotori Finance (2026-07) : migre les clés
          // localStorage `wealthly:*` / `wealthly-*` vers `yotori:*` /
          // `yotori-*` AVANT toute lecture. Ce script tourne avant le bundle,
          // c'est donc LE point de migration garanti (thème, langue, démo…).
          var legacy = [];
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && (k.indexOf('wealthly:') === 0 || k.indexOf('wealthly-') === 0)) legacy.push(k);
          }
          for (var j = 0; j < legacy.length; j++) {
            var nk = 'yotori' + legacy[j].slice('wealthly'.length);
            if (localStorage.getItem(nk) === null) localStorage.setItem(nk, localStorage.getItem(legacy[j]));
            localStorage.removeItem(legacy[j]);
          }
          // Défaut = clair (charte « Forêt »). On NE suit plus la
          // préférence système : sur mobile en mode sombre, l'app tombait sur
          // l'ancien thème dark (hors charte). Le dark reste dispo si l'user
          // le choisit explicitement via le toggle.
          var RESET = 'yotori-theme-default-light-v1';
          var t = localStorage.getItem('yotori-theme');
          // Migration unique : l'ancien code mémorisait 'dark' auto-détecté
          // depuis le système → on repasse tout le monde en clair une fois.
          if (!localStorage.getItem(RESET)) {
            t = 'light';
            localStorage.setItem('yotori-theme', 'light');
            localStorage.setItem(RESET, '1');
          }
          if (t !== 'light' && t !== 'dark') t = 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Yotori Finance typography — refonte tech 2026-06-25 :
         Geist      — UI sans (titres serrés inclus, fini le serif éditorial)
         Geist Mono — chiffres tabulaires, IBAN, codes, axes, gros nombres hero -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      :root { color-scheme: light; }
      :root[data-theme="dark"] { color-scheme: dark; }
      html, body {
        margin: 0;
        background: #F7F9F6;
        color: #0C0F0B;
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }
      :root[data-theme="dark"] html, :root[data-theme="dark"] body {
        background: #10150F;
        color: #ECF1E9;
      }
      /* Spinner pendant le chargement React */
      #root:empty::after {
        content: ''; position: fixed; inset: 0;
        background: var(--bg, #F7F9F6);
      }
      #root:empty::before {
        content: ''; position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 28px; height: 28px;
        border: 2px solid var(--border, #E2E6DF);
        border-top-color: var(--accent, #0E7C56);
        border-radius: 50%;
        animation: ws 0.7s linear infinite;
        z-index: 1;
      }
      @keyframes ws { to { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Wake up Railway backend immediately (fire-and-forget, before JS bundle parses).
         Passes via /api proxy (Vercel rewrite) pour rester same-origin. -->
    <script>try{fetch('/api/health').catch(function(){});}catch(e){}</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
